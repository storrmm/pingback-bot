name: Run Slack Daily Tracker

on:
  schedule:
    - cron: '0 14 * * *'   # 7:30 PM IST (14:00 UTC)
  workflow_dispatch:

permissions: 
  contents: write
  
jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install slack_sdk openpyxl pytz

      - name: Show trigger time
        run: |
          echo "UTC Time:"
          date -u
          echo ""
          echo "Runner Local Time:"
          date

      - name: Run Slack Daily Script
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EXCEL_FILE: ${{ secrets.EXCEL_FILE }}
          YOUR_USER_ID: ${{ secrets.MY_USER_ID }}
          POST_MODE: ${{ secrets.POST_MODE }}
          BASE_EXCLUDED_USERS: ${{ secrets.EXCLUDED_USERS }}
          SATURDAY_SKIP_USERS: ${{ secrets.EXCLUDED_USERS }}
        run: |
          python update_slack_log_env.py
      
      - name: Keep repository active
        run: |
          date -u > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update heartbeat [skip ci]" && git push)
